<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Arruda's Finance</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===================== TELA DE LOGIN / CADASTRO ===================== -->
<div class="auth-screen" id="auth-screen">
  <div class="auth-box">
    <h1 class="auth-logo">Arruda's<br/><span>Finance</span></h1>
    <p class="auth-subtitle">Controle financeiro pessoal da família</p>

    <div class="auth-title" id="auth-titulo">Entrar</div>

    <label class="modal-label">Email</label>
    <input type="email" id="auth-email" class="modal-input" placeholder="seu@email.com" autocomplete="username" />

    <label class="modal-label">Senha</label>
    <input type="password" id="auth-senha" class="modal-input" placeholder="••••••••" autocomplete="current-password" />

    <div class="auth-msg" id="auth-msg"></div>

    <button class="btn-primary auth-btn-confirmar" id="btn-auth-confirmar">Entrar</button>

    <div class="auth-toggle">
      <span id="auth-toggle-texto">Ainda não tem conta?</span>
      <button class="auth-toggle-btn" id="btn-auth-toggle">Cadastre-se</button>
    </div>
  </div>
</div>

<!-- ===================== APP PRINCIPAL ===================== -->
<div class="container app-screen" id="app-screen">

  <header>
    <div class="header-left">
      <h1>Arruda's<br/><span>Finance</span></h1>
      <p>Controle suas dívidas por abas · clique nas parcelas para marcar como pago</p>
    </div>
    <div class="header-right">
      <span class="header-user-email" id="header-user-email"></span>
      <button class="btn-back" id="btn-logout">Sair</button>
    </div>
  </header>

  <div class="tab-bar" id="tab-bar"></div>

  <div id="app-content"></div>

</div>

<!-- Modal: nova dívida -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-title">Nova Dívida</div>

    <label class="modal-label">Título da dívida</label>
    <input type="text" id="input-titulo" class="modal-input" placeholder="Ex: Financiamento do Carro" />

    <label class="modal-label">Valor de cada parcela (R$)</label>
    <input type="number" id="input-valor" class="modal-input" placeholder="Ex: 350" min="0" step="0.01" />

    <label class="modal-label">Quantidade de meses</label>
    <input type="number" id="input-meses" class="modal-input" placeholder="Ex: 12" min="1" step="1" />

    <div class="modal-row">
      <div class="modal-col">
        <label class="modal-label">Mês inicial</label>
        <select id="input-mes-inicial" class="modal-input"></select>
      </div>
      <div class="modal-col">
        <label class="modal-label">Ano inicial</label>
        <input type="number" id="input-ano-inicial" class="modal-input" step="1" />
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn-secondary" id="btn-cancelar-modal">Cancelar</button>
      <button class="btn-primary" id="btn-criar-divida">Criar Dívida</button>
    </div>
  </div>
</div>

<!-- Modal: editar valor de uma parcela -->
<div class="modal-overlay" id="edit-parcela-overlay">
  <div class="modal">
    <div class="modal-title">Editar Parcela</div>
    <div class="edit-parcela-info" id="edit-parcela-info"></div>

    <label class="modal-label">Novo valor da parcela (R$)</label>
    <input type="number" id="input-edit-valor" class="modal-input" min="0" step="0.01" />

    <div class="modal-actions">
      <button class="btn-secondary" id="btn-cancelar-edit-parcela">Cancelar</button>
      <button class="btn-primary" id="btn-salvar-edit-parcela">Salvar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
